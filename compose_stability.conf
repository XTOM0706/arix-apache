// Compose stability configuration.
// Force read-only data classes that are cross-module or carry List/Map fields to be
// treated as stable, so list-row composables holding them can skip on structural equality
// (same idea as annotating ChatBubble @Immutable on the chat page). Using a config file
// instead of annotations avoids making the pure data/cloudapi modules depend on
// compose-runtime (mirrors RikkaHub's compose_compiler_config.conf).
// Syntax: one fully-qualified class name per line; trailing .* wildcard supported; // comments.

// data module: list-row entities (conversation / memory / character-card lists)
com.arix.data.entity.MemoryEntity
com.arix.data.entity.CharacterCardEntity
com.arix.data.dao.ConversationSummary

// cloudapi module: API-monitor aggregate snapshots (nested in object ApiMonitor)
com.arix.cloudapi.ApiMonitor.ApiMonitorSummary
com.arix.cloudapi.ApiMonitor.ProviderStats
com.arix.cloudapi.ApiMonitor.CallRecord

// Operit marketplace / packages (List / Map fields), nested in their objects
com.arix.tool.OperitCompat.OperitPackage
com.arix.tool.CloudMarketplace.MarketItem
com.arix.tool.CloudMarketplace.MarketComment

// memory-graph edge
com.arix.app.MemEdge

// ---- :terminal 模块（2026-07-25）----
// 全是「构造完就不再变」的只读模型，但字段里有 List / java.io.File / sealed 接口，
// Compose 默认判不稳 → 持有它们的行每次都重组。这里强制判稳。
// 文件列表行（Entry 的字段全是构造时拍下的 stat 快照，不随磁盘变；Listing 只是它的容器）
com.arix.terminal.Entry
com.arix.terminal.Listing
// 环境/发行版模型（DistroSpec 含 sealed DistroSource；两个实现也一并标）
com.arix.terminal.DistroSpec
com.arix.terminal.DistroSource
com.arix.terminal.DistroSource.Tarball
com.arix.terminal.DistroSource.Oci
// 设置页/终端页里按列表渲染的小模型（嵌套在各自 object 里，注意 Outer.Inner 点号）
com.arix.terminal.TermBeautify.PromptStyle
com.arix.terminal.TermuxStyle.ColorPreset
com.arix.terminal.TerminalEnv.ShellInfo
com.arix.terminal.DistroProvision.MirrorOption
com.arix.terminal.QuickCmds.Cmd
com.arix.terminal.BackupManager.BackupFile
